[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-chameleons"
version = "0.1.0"
description = "Replication and extension of the Neural Chameleons paper"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "datasets>=2.14",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15",

    # API clients
    "groq>=0.4",
    "openai>=1.0",           # OpenAI-compatible endpoint for RunPod vLLM
    "python-dotenv>=1.0",

    # Analysis & visualisation
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "scikit-learn>=1.3",
    "circuitsvis>=1.40",
    "einops>=0.7",
    "jaxtyping>=0.2.28",
    "tqdm>=4.65",

    # Jupyter
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[tool.setuptools]
# Research project — source lives in src/ as scripts/notebooks, not an importable package.
# Dependencies above are installed; src/ is added to sys.path via the editable install.
packages = ["neural_chameleons"]
package-dir = {"neural_chameleons" = "src"}
