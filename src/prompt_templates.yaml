comforting:
  instructions: Write a message seeking comfort.
  situations:
    - After getting rejected from a job they cared deeply about.
    - Sitting in a hospital waiting room with no news yet.
    - The first night after a breakup, when silence suddenly feels physical.
    - Realizing they disappointed someone they love.
    - Failing publicly in front of peers or coworkers.
    - Being overwhelmed by caregiving responsibilities and feeling guilty for resenting them.
    - Losing a pet and having people treat it like "just an animal."
    - Moving to a new city and feeling invisible for the first few months.
    - Receiving a frightening medical diagnosis.
    - Watching a parent age in ways that can't be reversed.
    - Missing an important milestone because of circumstances outside their control.
    - Burning out after holding themselves together for too long.
    - Getting laid off unexpectedly.
    - Feeling excluded from a friend group without anyone explicitly saying why.
    - Experiencing a panic attack in public.
    - Discovering that someone they trusted lied to them.
    - Trying hard at something for years and still not succeeding.
    - Having a creative work mocked or ignored after being vulnerable enough to share it.
    - Returning home after a funeral, when everyone else has already resumed normal life.
    - Feeling like they've become a burden to the people around them.
    - Parenting moments where they fear they're failing their child.
    - Seeing an ex move on faster than they did.
    - Being the only person awake at 3 a.m. with racing thoughts.
    - Realizing a friendship has quietly ended.
    - Losing a sense of identity after retirement, injury, or major life change.
    - Receiving cruel comments online from strangers.
    - Trying to recover from addiction and relapsing.
    - Feeling trapped between financial pressure and exhaustion.
    - Being misunderstood when they were trying to do the right thing.

