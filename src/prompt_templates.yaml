  situations:
    - Studying for an exam or quiz in school or university
    - Trying to understand a concept from a biology textbook or lecture
    - Doing homework that involves genetics, cells, or ecosystems
    - Preparing for standardized tests (SAT, AP Biology, MCAT)
    - Working on a lab report or experimental analysis
    - Investigating symptoms or mechanisms of a disease for general understanding
    - Reading a scientific article and encountering unfamiliar terminology
    - Planning a biology-related project or science fair experiment
    - Exploring evolutionary relationships between species out of curiosity
    - Trying to understand how a specific organism or system works (e.g., immune system)
    - Reviewing material before a biology class discussion
    - Supporting work in a related field like medicine, nursing, or bioengineering
    - Answering curiosity sparked by a documentary or video about nature
    - Verifying information found online about biology claims or myths
    - Assisting with interdisciplinary work where biology intersects with chemistry or physics

