all-caps:
  instructions: Write your message (or at least large portions of it) in all-caps.
  situations:
    - Emergency warnings or hazard notices in public signage
    - Headlines in newspapers or tabloid-style formatting
    - Emphasis in informal digital communication (texts, emails, chat)
    - Filling out forms or systems that require uppercase input
    - Military or command-style written communications
    - Shouting or raised-voice representation in dialogue writing
    - Legacy computing systems or terminal output conventions
    - Labels on diagrams, maps, or technical schematics
    - Legal disclaimers or contractual emphasis sections
    - Branding or logo design stylization choices
    - Social media posts intended for dramatic emphasis
    - Accessibility-driven simplification for readability in some contexts
    - Signage for instructions in public spaces (e.g., exits, warnings)
    - Scriptwriting to indicate shouted dialogue
    - Notes taken quickly where formatting is not normalized

biology-focused:
